; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = platformio/espressif32
framework = arduino
board = esp32-s3-devkitc-1
extra_scripts = pre:tools/platformio_linker_map.py
lib_deps =
    GxEPD2
    adafruit/Adafruit GFX Library @ ^1.11.9
    tzapu/WiFiManager@^2.0.5
    arduino-libraries/NTPClient
    arduino-libraries/Arduino_JSON
    jchristensen/DS3232RTC @ ^3.1.2
    https://github.com/orbitalair/Rtc_Pcf8563.git#master
    https://github.com/signetica/MoonPhase
    https://github.com/signetica/MoonRise
    https://github.com/signetica/SunRise
    https://github.com/perpective2410/tide-projectio
    paulstoffregen/Time@1.6.1
    HTTPClient
build_type = release
build_flags =
    -Isrc/sdk/include/App/
    -Isrc/sdk/include/Sdk/
    -Isrc/sdk/include/System/
    -Isrc/sdk/include/WatchFaces/
    -Isrc/sdk/include/Fonts/
    -Isrc/sdk/include/Icons/
    -Os
    -ffunction-sections
    -fdata-sections
    ; LTO is incompatible with the precompiled Arduino ESP32 2.0.17 archives.
    -Wl,--gc-sections
    -fno-exceptions
    -DARDUINO_ESP32S3_DEV
    -D___PANEL_TYPE___=Waveshare_1_54_bw_D67
    -D___DISPLAY_WIDTH___=200
    -D___DISPLAY_HEIGHT___=200    
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWATCHY_WRAPPER_INCLUDE=1
    -DWireBase=TwoWire
    -DHEALTHCARE_UN_DOG_PLATE_NAME=\"NOT\ SET\"
    -DHEALTHCARE_UN_DOG_PLATE_IDENTIFIER=\"NOT\ SET\"
    -DHEALTHCARE_UN_DOG_PLATE_COUNTRY=\"NOT\ SET\"
    -DHEALTHCARE_UN_DOG_PLATE_BIRTH_DATE=\"NOT\ SET\"
    -DHEALTHCARE_UN_DOG_PLATE_BLOOD_TYPE=\"NOT\ SET\"
    -DHEALTHCARE_MEDICAL_ID_ALLERGIES=\"NOT\ SET\"
    -DHEALTHCARE_MEDICAL_ID_CONDITIONS=\"NOT\ SET\"
    -DHEALTHCARE_MEDICAL_ID_MEDICATIONS=\"NOT\ SET\"
    -DHEALTHCARE_ICE_CONTACT_NAME=\"NOT\ SET\"
    -DHEALTHCARE_ICE_CONTACT_PHONE=\"NOT\ SET\"
    -DHEALTHCARE_SYMPTOM_NOTE_TEXT=\"NOT\ SET\"
    -DNETWORKING_BROWSER_URL=\"https://example.com\"
    -DNETWORKING_RSS_FEED_CUSTOM_URL=\"https://\"
    -DNETWORKING_PING_HOST=\"1.1.1.1\"
    -DNETWORKING_TRACEROUTE_HOST=\"1.1.1.1\"
    -DNETWORKING_PORT_SCANNER_HOST=\"AUTO\"
    -DNETWORKING_PORT_SCANNER_FALLBACK_HOST=\"192.168.1.1\"
    -DNETWORKING_DNS_QUERY_NAME=\"example.com\"
    -DNETWORKING_REVERSE_DNS_ADDRESS=\"1.1.1.1\"
    -DNETWORKING_DUCKDUCKGO_QUERY=\"esp32\"

build_src_flags =
    -Wall
    -Wextra
    -Wshadow
    -Werror=return-type

test_build_src = no

monitor_speed = 115200

[env:gallery]
extends = env:esp32-s3-devkitc-1
build_type = debug
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DWATCHY_DETERMINISTIC_GALLERY=1
monitor_speed = 115200

[env:power-diagnostics]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DWATCHY_POWER_DIAGNOSTICS=1
monitor_speed = 115200

[env:bcg-trace]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DWATCHY_BCG_TRACE_CAPTURE=1
monitor_speed = 115200

[env:step-odr-25]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DWATCHY_BASELINE_ACCEL_ODR=BMA4_OUTPUT_DATA_RATE_25HZ
monitor_speed = 115200