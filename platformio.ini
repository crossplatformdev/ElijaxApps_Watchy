; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = platformio/espressif32
framework = arduino
board = esp32-s3-devkitc-1
lib_deps =
    Adafruit BusIO
    Adafruit GFX Library@1.12.6
    Arduino_JSON
    DS3232RTC
    GxEPD2
    Rtc_Pcf8563
    WiFiManager
    NTPClient
    https://github.com/signetica/MoonPhase
    https://github.com/signetica/MoonRise
    https://github.com/signetica/SunRise
    https://github.com/perpective2410/tide-projectio

build_type = debug
build_unflags =
    -O0
    -Og
build_flags =
    -Isrc
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -fno-exceptions
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DARDUINO_ESP32S3_DEV=1
    -D___PANEL_TYPE___=Waveshare_1_54_bw_D67
    -D___DISPLAY_WIDTH___=200
    -D___DISPLAY_HEIGHT___=200    
    -DCORE_DEBUG_LEVEL=0
    -DWATCHY_WRAPPER_INCLUDE=1
    -DWireBase=TwoWire

test_build_src = no

monitor_speed = 115200    

[env:gallery]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DWATCHY_DETERMINISTIC_GALLERY=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
